name: moda-hub

# Credentials below are for local development only.
x-app: &app
  build: .
  image: moda-hub:dev
  environment:
    NODE_ENV: ${NODE_ENV:-development}
    LOG_LEVEL: ${LOG_LEVEL:-info}
    DATABASE_URL: postgres://moda:moda@postgres:5432/moda
    REDIS_URL: redis://redis:6379/0
    SMTP_URL: smtp://mailpit:1025
    APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
    JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?set JWT_PRIVATE_KEY in .env (node scripts/generate-jwt-key.mjs)}
    ORDER_RESERVATION_TTL: ${ORDER_RESERVATION_TTL:-30m}
    # Optional: without them checkout answers 503. Test-mode keys only.
    STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
    STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}

services:
  # Applies database migrations once, before the API starts.
  migrate:
    <<: *app
    command: ["node", "dist/cli.js", "migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Outbox relay and queue processors: same image, no HTTP.
  worker:
    <<: *app
    command: ["node", "--enable-source-maps", "dist/worker.js"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Catches every email the worker sends: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.31.4
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: moda
      POSTGRES_PASSWORD: moda
      POSTGRES_DB: moda
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moda -d moda"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Forwards Stripe test-mode webhooks to the API:
  #   docker compose --profile stripe up -d
  stripe:
    image: stripe/stripe-cli:v1.53.0
    profiles: ["stripe"]
    command: ["listen", "--forward-to", "api:3000/api/v1/payments/webhook"]
    environment:
      STRIPE_API_KEY: ${STRIPE_SECRET_KEY:-}
    depends_on:
      - api

volumes:
  pgdata:
