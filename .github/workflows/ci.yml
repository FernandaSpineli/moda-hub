name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Also verifies the lockfile against pnpm's supply-chain policies.
      - run: pnpm install --frozen-lockfile
      - name: Biome (lint + format, read-only)
        run: pnpm exec biome ci .
      - name: Typecheck
        run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Integration and API tests start PostgreSQL, Redis and Mailpit with
      # Testcontainers, using the runner's Docker daemon.
      - name: Test with coverage
        run: pnpm exec vitest run --coverage --coverage.reporter=text-summary --coverage.reporter=lcov
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/lcov.info

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scan the whole history for secrets
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
      - name: gitleaks
        run: docker run --rm -v "$PWD":/repo zricethezav/gitleaks:v8.30.1 git /repo --no-banner --redact
      - name: hadolint
        run: docker run --rm -i hadolint/hadolint < Dockerfile

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: docker/setup-buildx-action@v4
      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: moda-hub:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
